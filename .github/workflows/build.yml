name: Build Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 Core and Libraries
        run: |
          URL=$(printf "%s://%s.%s/espressif/arduino-esp32/gh-pages/package_esp32_index.json" "https" "raw.githubusercontent" "com")
          GIT=$(printf "%s://%s.%s/lemmingDev/ESP32-BLE-Gamepad.git" "https" "github" "com")
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls "$URL"
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "LovyanGFX" "NimBLE-Arduino@1.4.2" "PCF8574 library"
          arduino-cli lib install --git-url "$GIT"

      - name: Compile Sketch
        run: |
          mkdir -p build_sketch
          cp *.ino build_sketch/build_sketch.ino
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=opi,FlashSize=16M --output-dir ./firmware build_sketch

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-controller-bin
          path: ./firmware/*.bin
